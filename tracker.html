<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPX Tracker</title>
<link rel="manifest" href="manifest.webmanifest?v=8">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=8">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=8">
<link rel="shortcut icon" href="icon-192.png?v=8">
<link rel="apple-touch-icon" href="icon-192.png?v=8">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="app.css">
<body data-page="nav">
<div class="app">
  <aside id="sheet">
    <button class="grab" id="grab" type="button" aria-label="패널 열기/닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg><span id="grabTxt"></span></button>
    <div class="sheetbody">
    <div class="head"><h1>Tracking <small id="ver" style="font-weight:400;color:var(--muted)"></small></h1></div>
    <div class="sec">
      <div class="sh">계획 경로 (GPX)</div>
      <div class="drop" id="drop"><b>＋ GPX 파일 불러오기</b> (여러 개 선택 가능 · 이 페이지에만 저장됨)<br><small id="fileinfo">로드된 파일 없음</small></div>
      <div id="filelist"></div>
      <input type="file" id="file" accept="*/*" multiple hidden>
    </div>
    <div class="sec">
      <div class="sh">오프라인 지도</div>
      <button id="btnOff" style="width:100%;padding:10px">경로 주변 지도 저장 (인터넷 있을 때)</button>
      <small id="offinfo" style="display:block;margin-top:6px;color:var(--muted)"></small>
    </div>
    <div class="sec"><div class="row" style="margin-top:0"><label>지도</label><select id="base"></select></div></div>
    </div>
  </aside>
  <div class="mapwrap"><div id="map"></div><div class="wx" id="wx" hidden></div><div class="toast" id="toast"></div>
    <button class="locate" id="btnLocate" title="내 위치로 이동" aria-label="내 위치로 이동"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg></button>
    <button class="locate" id="btnNorth" title="북쪽 위 / 진행방향 위 전환" aria-label="북쪽 위 / 진행방향 위 전환"><svg id="northIcon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10.2"/><path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4" stroke-width="1.8"/><path d="M12 5.2 15 12H9z" fill="#f97316" stroke="#f97316"/><path d="M12 18.8 9 12h6z" fill="currentColor" stroke="none" opacity=".85"/><circle cx="12" cy="12" r="1.1" fill="#0a0a0c" stroke="none"/></svg></button>
    <div class="nav nav2">
      <div class="hud" id="hud"></div>
      <button class="fab" id="btnOpt" type="button" aria-label="옵션"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="9" cy="17" r="2" fill="currentColor"/></svg></button>
      <div class="menu" id="menu" hidden>
        <div class="acts" id="acts"><button id="btnRec">● 기록 시작</button><button id="btnDim" title="절전 화면(검은 화면에 방향·속도)">절전 화면</button></div>
        <button id="btnSettings" type="button">설정 · 경로 · 지도</button>
        <div class="seg" id="seg"><button data-m="view" data-go="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 2"/></svg>History</button></div>
      </div>
    </div>
  </div>
</div>

<div id="dim" hidden>
  <svg id="dimRose" viewBox="-100 -100 200 200"><g id="roseRot"><circle r="86" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/><path d="M0-86v-12M0 86v12M-86 0h-12M86 0h12" stroke="currentColor" stroke-width="3"/><text y="-64" text-anchor="middle" font-size="22" fill="currentColor">N</text><text x="68" y="8" text-anchor="middle" font-size="18" fill="currentColor" opacity=".7">E</text><text y="80" text-anchor="middle" font-size="18" fill="currentColor" opacity=".7">S</text><text x="-68" y="8" text-anchor="middle" font-size="18" fill="currentColor" opacity=".7">W</text></g><path d="M0-52 20 26 0 12-20 26z" fill="currentColor"/></svg>
  <svg id="dimGo" viewBox="-100 -100 200 200" style="display:none"><path id="goArrow" d="M0-84 58 62 0 32-58 62z" fill="currentColor"/></svg>
  <div id="dimDir"></div><div id="dimSpd"></div><div id="dimWx"></div><div id="dimRec"></div><div id="dimHint"></div>
</div>
<script src="lib/leaflet.js"></script>
<script src="lib/leaflet-rotate.js"></script>
<script src="app.js"></script>
</body>
</html>
